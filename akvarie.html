<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akvarie</title>

    <link rel="stylesheet" href="css/akvarie.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Fredoka:wght@300..700&family=Julius+Sans+One&display=swap" rel="stylesheet">
</head>

<body>

    <!-- BAGGRUND -->
    <div class="aquarium">

        <!-- Solstråler -->
        <div class="ray" style="left:10%;"></div>
        <div class="ray" style="left:28%;"></div>
        <div class="ray" style="left:45%;"></div>
        <div class="ray" style="left:65%;"></div>
        <div class="ray" style="left:82%;"></div>

        <!-- Glimt -->
        <div class="sparkle" style="top:8%; left:12%;"></div>
        <div class="sparkle" style="top:14%; left:26%;"></div>
        <div class="sparkle" style="top:10%; left:74%;"></div>
        <div class="sparkle" style="top:22%; left:86%;"></div>
        <div class="sparkle" style="top:18%; left:55%;"></div>

        <!-- Bobler -->
        <div id="bubbles-layer"></div>

        <!-- Sand -->
        <div class="sand"></div>

        <!-- Mørk kant -->
        <div class="vignette"></div>

    </div>

    <!-- FISK -->
    <section id="akvarie">
        <div class="fish">
            <img src="img/seahorse.gif" alt="seahorse" class="fish1" id="seaHorse">
            <img src="img/fish-1-gif.gif" alt="purple fish" class="fish2" id="purpleFish">
            <img src="img/fish-2-gif.gif" alt="clownfish" class="fish3" id="clownFish">
            <img src="img/fish-4-gif.gif" alt="guld fisk" class="fish4" id="guldFisk">
            <img src="img/crab-walking.gif" alt="krabbe" class="fish5" id="krabbe">
        </div>
    </section>

    <!-- FAKTABOKS -->
    <div id="faktaBoks">
        <div id="fiskeFakta" class="fiskeFakta"></div>
    </div>

    <!-- KNAPPER -->
    <div id="buttons">
        <a href="startside.html" id="tilbageKnap">
            <img src="img/home-button.png" alt="home button">
        </a>

        <h1 id="pushHeader">TRYK PÅ FISKEN OG LÆR OM DEN!</h1>

        <a href="the-card.html" id="globusKnap">
            <img src="img/globe-button2.png" alt="globe">
        </a>
    </div>

    <!-- JS -->
    <script src="js/fish-swimming.js"></script>

</body>
</html>
